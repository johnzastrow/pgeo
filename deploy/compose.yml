# pgeo, serving. Three stock images and this file: the database, the pure-SQL API, and an edge
# that serves the demo page and maps the Pelias paths onto it. No data is built here - a dump
# made by pgeo-build (or scripts/pgeo_dump.sh) is restored, and refreshed later with
# scripts/pgeo_swap.sh, which keeps the service up while it works.
#
#   cp .env.example .env && edit it        # two passwords
#   docker compose up -d
#   ./pgeo_swap.sh --dump dumps/pgeo-<build>-<version>-<date>.dump
#
# The edge listens on 127.0.0.1:8090 by default. Put your own TLS terminator in front of it; it
# deliberately does not terminate TLS or hold a certificate.
# The stack name prefixes the project and every container. It defaults to "pgeo", which is right
# on a host dedicated to serving - but a machine that also runs this repository's development
# stack already has containers by those names, and compose will take them over. Set PGEO_STACK to
# something else there.
name: ${PGEO_STACK:-pgeo}
services:
  db:
    # The same base pgeo-build uses, so a dump from one restores into the other by construction.
    # The query side needs core and contrib extensions only - libpostal is an optional arm that
    # lives in the larger pgeo-db image, and carrying its 1.9 GB of models here would be waste.
    image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
    container_name: ${PGEO_STACK:-pgeo}_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pgeo
      POSTGRES_USER: pgeo
      POSTGRES_PASSWORD: ${PGEO_DB_PASSWORD:?set PGEO_DB_PASSWORD in .env}
      # Read by db/init/api-role.psql on the cluster's first boot (and by pgeo_swap.sh from .env
      # on every refresh). The limits are optional: blank means the built-in default.
      PGEO_API_PASSWORD: ${PGEO_API_PASSWORD:?set PGEO_API_PASSWORD in .env}
      PGEO_API_STATEMENT_TIMEOUT: ${PGEO_API_STATEMENT_TIMEOUT:-5s}
      PGEO_MAX_TEXT: ${PGEO_MAX_TEXT:-}
      PGEO_MAX_SIZE: ${PGEO_MAX_SIZE:-}
      PGEO_MAX_CIRCLE_KM: ${PGEO_MAX_CIRCLE_KM:-}
      PGEO_MAX_REVERSE_KM: ${PGEO_MAX_REVERSE_KM:-}
      PGEO_MAX_ADDRESS_KM: ${PGEO_MAX_ADDRESS_KM:-}
    shm_size: 512m
    # The entrypoint drops from root to postgres itself; nothing in it needs to gain privileges.
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./pgdata:/var/lib/postgresql/18/docker
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./dumps:/dumps:ro
    # No published port: only PostgREST talks to it, over the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgeo -d pgeo"]
      interval: 5s
      retries: 30

  rest:
    image: postgrest/postgrest:v16.5@sha256:1347d7552b88f17832912c06afbf7c43209af6eeeb60834b04aae12c9bd9d5cc
    container_name: ${PGEO_STACK:-pgeo}_rest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      # pgeo_api is read-only and owns nothing; the dump grants it what it needs.
      PGRST_DB_URI: "postgres://pgeo_api:${PGEO_API_PASSWORD:?set PGEO_API_PASSWORD in .env}@db:5432/pgeo"
      PGRST_DB_SCHEMAS: "geocode_api"
      PGRST_DB_ANON_ROLE: "pgeo_api"
      PGRST_DB_POOL: "${PGEO_REST_POOL:-10}"
      PGRST_SERVER_PORT: "3000"
      PGRST_OPENAPI_MODE: "disabled"
      PGRST_DB_MAX_ROWS: "40"
    # A static binary that needs no capabilities, no root and no writable filesystem.
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # No published port either: the edge is the only way in.

  edge:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    container_name: ${PGEO_STACK:-pgeo}_edge
    restart: unless-stopped
    depends_on: [rest]
    # The nginx master starts as root and switches its workers to the nginx user, which needs
    # exactly these three capabilities; everything else is dropped.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    environment:
      # Only these names are substituted into the template; nginx's own $variables are untouched.
      NGINX_ENVSUBST_FILTER: "^PGEO_EDGE_"
      PGEO_EDGE_RATE: ${PGEO_EDGE_RATE:-10}                       # requests/s per client address
      PGEO_EDGE_BURST: ${PGEO_EDGE_BURST:-20}                     # burst above that, most endpoints
      PGEO_EDGE_BURST_AUTOCOMPLETE: ${PGEO_EDGE_BURST_AUTOCOMPLETE:-40}   # autocomplete fires per keystroke
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
      # A template: the image writes conf.d/default.conf from it at startup, filling in the
      # rate limits below.
      - ./edge/pgeo.conf:/etc/nginx/templates/default.conf.template:ro
      - ./edge/real-ip.conf:/etc/nginx/pgeo-real-ip.conf:ro
      - ./web:/srv/web:ro
      - ./tiles:/srv/tiles:ro
    ports: ["${PGEO_EDGE_BIND:-127.0.0.1}:${PGEO_EDGE_PORT:-8090}:8090"]
