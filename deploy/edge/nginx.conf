# Main nginx.conf for the dev image: identical to the image's own except that the njs module is
# loaded, which only the main context can do. Everything else is in conf.d/default.conf.
load_module modules/ngx_http_js_module.so;
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;
events { worker_connections  1024; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;   # no nginx version in the Server header or error pages
    # Path only, never the query string: a geocoder's query strings are the addresses people
    # searched for. Same format as the Ansible edge (docs/SECURITY_DEPLOYMENT.md); the referer is
    # left out too, since it can carry the demo page's own query.
    log_format pathonly '$remote_addr - - [$time_local] "$request_method $uri" '
                        '$status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log pathonly;
    include /etc/nginx/conf.d/*.conf;
}
