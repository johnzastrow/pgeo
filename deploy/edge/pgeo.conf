# The serving bundle's edge: the demo page, the basemap, and the Pelias-compatible paths mapped
# onto PostgREST's RPC endpoints. It listens inside the compose network; put a TLS terminator in
# front of it (this project's own deployment uses Caddy).
#
# PostgREST keeps only the last segment of a dotted query key, and the SQL API's argument names
# are those last segments, so most query strings pass through untouched. The exception is
# boundary.circle.lat/lon, which would collide with focus.point.lat/lon, so they are renamed
# before they get there.
map $args $pgeo_args_1 {
    "~^(?<c1a>.*?)boundary\.circle\.lat=(?<c1b>.*)$" "${c1a}circle_lat=${c1b}";
    default $args;
}
map $pgeo_args_1 $pgeo_args_2 {
    "~^(?<c2a>.*?)boundary\.circle\.lon=(?<c2b>.*)$" "${c2a}circle_lon=${c2b}";
    default $pgeo_args_1;
}
map $pgeo_args_2 $pgeo_circle_args {
    "~^(?<c3a>.*?)boundary\.circle\.radius=(?<c3b>.*)$" "${c3a}circle_radius=${c3b}";
    default $pgeo_args_2;
}

# A geocoder is typed into, so the burst matters more than the steady rate.
limit_req_zone $binary_remote_addr zone=pgeo_api:10m rate=10r/s;

server {
    listen 8090;
    server_name _;
    root /srv/web;
    index index.html;

    # nginx resolves an upstream name once, at startup, and refuses to start if it is missing -
    # so a PostgREST that is slow or restarting takes the edge down with it, and it does not come
    # back on its own. Naming the upstream through a variable defers the lookup to request time,
    # against Docker's embedded DNS. The edge then starts regardless of what rest is doing, and a
    # restart of rest costs a few 502s rather than the whole front end. Every proxy_pass below
    # gives its URI explicitly, which is required once a variable is in play.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pgeo_rest rest;

    # The page loads nothing from anywhere else - MapLibre, PMTiles and the fonts are all
    # same-origin - which is what lets this be as strict as it is.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 1m;

    # The basemap. PMTiles reads a slice at a time, so range requests matter here.
    location /tiles/ { alias /srv/tiles/; }
    location ~* \.mjs$ { default_type text/javascript; try_files $uri =404; }

    location = /v1/search            { limit_req zone=pgeo_api burst=20 nodelay; limit_except GET { deny all; } proxy_pass http://$pgeo_rest:3000/rpc/v1_search?$pgeo_circle_args; }
    location = /v1/search/structured { limit_req zone=pgeo_api burst=20 nodelay; limit_except GET { deny all; } proxy_pass http://$pgeo_rest:3000/rpc/v1_search_structured?$pgeo_circle_args; }
    location = /v1/autocomplete      { limit_req zone=pgeo_api burst=40 nodelay; limit_except GET { deny all; } proxy_pass http://$pgeo_rest:3000/rpc/v1_autocomplete?$pgeo_circle_args; }
    location = /v1/reverse           { limit_req zone=pgeo_api burst=20 nodelay; limit_except GET { deny all; } proxy_pass http://$pgeo_rest:3000/rpc/v1_reverse$is_args$args; }
    location = /v1/place             { limit_req zone=pgeo_api burst=20 nodelay; limit_except GET { deny all; } proxy_pass http://$pgeo_rest:3000/rpc/v1_place$is_args$args; }
    # pgeo's own addition rather than a Pelias path: a structured USPS-style address
    location = /v1/address           { limit_req zone=pgeo_api burst=20 nodelay; limit_except GET { deny all; } proxy_pass http://$pgeo_rest:3000/rpc/v1_address$is_args$args; }
    # Pelias serves the licence page to any client; PostgREST returns the media-type domain
    # verbatim only when asked for it, so the edge asks on the client's behalf.
    location = /v1/attribution {
        limit_except GET { deny all; }
        proxy_set_header Accept "text/html";
        proxy_pass http://$pgeo_rest:3000/rpc/v1_attribution;
    }
    # Anything else under /v1 is not a path this serves. Say so in the shape a Pelias client
    # expects, rather than passing PostgREST's "function not found" through as a 404.
    location /v1/ {
        default_type application/json;
        return 400 '{"geocoding":{"version":"0.2","errors":["unsupported parameter or endpoint: pgeo accepts the documented Pelias parameters"]},"type":"FeatureCollection","features":[]}';
    }

    location / {
        # Tell the page where the engine list is. Without this the page never asks, falls back to
        # its built-in default - a single engine called "Pelias" on this origin - and so labels
        # pgeo's own answers "Pelias / Elasticsearch" while hiding the tabs that only pgeo can
        # serve. web/engines.json is what it then reads; see docs/DEMO_ENGINES.md.
        sub_filter '</head>' '<meta name="demo-engines" content="/engines.json"></head>';
        sub_filter_once on;
        try_files $uri $uri/ =404;
    }
}
