# Which upstream proxies the edge believes about the client's address.
#
# The edge rate-limits per client address. Behind a TLS terminator every request arrives from the
# terminator, so without this file every visitor shares one bucket, and one busy client gets
# everyone else refused. Listed proxies may name the real client in X-Forwarded-For; anyone else
# may not, so a client cannot pick its own rate-limit key by sending the header itself.
#
# The defaults cover a terminator on the same host (it reaches the edge through Docker's
# published port, from the bridge gateway) or on the same compose network. If the terminator is
# on another machine, replace them with its address only - not a whole LAN - and keep it the only
# thing that can reach the edge's port.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
