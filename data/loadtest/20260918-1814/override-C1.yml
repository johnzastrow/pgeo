services:
  elasticsearch:
    cpuset: "0"
    mem_limit: 1536m
    memswap_limit: 1536m
    environment:
      - "ES_JAVA_OPTS=-Xms768m -Xmx768m"
      - "path.repo=/usr/share/elasticsearch/snapshots"
  libpostal:
    cpuset: "0"
    mem_limit: 1945m
    memswap_limit: 1945m
  placeholder:
    cpuset: "0"
    mem_limit: 358m
    memswap_limit: 358m
  pip:
    cpuset: "0"
    mem_limit: 409m
    memswap_limit: 409m
  interpolation:
    cpuset: "0"
    mem_limit: 1945m
    memswap_limit: 1945m
  api:
    cpuset: "0"
    mem_limit: 430m
    memswap_limit: 430m
    environment:
      - "PORT=4000"
      - "CPUS=1"
