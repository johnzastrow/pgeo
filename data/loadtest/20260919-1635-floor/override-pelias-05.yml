services:
  elasticsearch:
    cpuset: "0"
    cpus: 0.25
    mem_limit: 819m
    memswap_limit: 819m
    environment:
      - "ES_JAVA_OPTS=-Xms448m -Xmx448m"
      - "path.repo=/usr/share/elasticsearch/snapshots"
  libpostal:
    cpuset: "0"
    cpus: 0.25
    mem_limit: 2048m
    memswap_limit: 2048m
  placeholder:
    cpuset: "0"
    cpus: 0.25
    mem_limit: 819m
    memswap_limit: 819m
  pip:
    cpuset: "0"
    cpus: 0.25
    mem_limit: 716m
    memswap_limit: 716m
  interpolation:
    cpuset: "0"
    cpus: 0.25
    mem_limit: 2150m
    memswap_limit: 2150m
  api:
    cpuset: "0"
    cpus: 0.25
    mem_limit: 430m
    memswap_limit: 430m
    environment:
      - "PORT=4000"
      - "CPUS=1"
