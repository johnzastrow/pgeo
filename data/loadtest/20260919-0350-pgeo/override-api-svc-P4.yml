services:
  db:
    cpuset: "0,1,2,3"
    volumes:
      - "/home/jcz/Forge/pelia_maine/data/loadtest/20260919-0350-pgeo/tuning-P4.conf:/etc/postgresql/tuning/active.conf:ro"
    mem_limit: 2048m
    memswap_limit: 2048m
  api:
    cpuset: "0,1,2,3"
    mem_limit: 563m
    memswap_limit: 563m
    environment:
      PGEO_PARSE_MODE: "service"
      PGEO_WORKERS: "4"
      PGEO_POOL_MAX: "2"
  libpostal:
    cpuset: "0,1,2,3"
    mem_limit: 2048m
    memswap_limit: 2048m
