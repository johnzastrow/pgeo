services:
  elasticsearch:
    cpuset: "0"
    mem_limit: 1536m
    memswap_limit: 1536m
    environment:
      - "ES_JAVA_OPTS=-Xms768m -Xmx768m"
      - "path.repo=/usr/share/elasticsearch/snapshots"
  libpostal:
    cpuset: "0"
    mem_limit: 2252m
    memswap_limit: 2252m
  placeholder:
    cpuset: "0"
    mem_limit: 1024m
    memswap_limit: 1024m
  pip:
    cpuset: "0"
    mem_limit: 921m
    memswap_limit: 921m
  interpolation:
    cpuset: "0"
    mem_limit: 2355m
    memswap_limit: 2355m
  api:
    cpuset: "0"
    mem_limit: 430m
    memswap_limit: 430m
    environment:
      - "PORT=4000"
      - "CPUS=1"
