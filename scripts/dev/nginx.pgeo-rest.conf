# Edge for the Phase 13 pure-SQL API: Pelias paths -> PostgREST RPC paths, GET only.
# PostgREST (127.0.0.1:4600) keeps only the last segment of dotted query keys, and the SQL
# API's argument names are those last segments, so query strings pass through unchanged.
# Local only: listens on 127.0.0.1:4700. Production would put these rules in the VM's nginx.
server {
    listen 127.0.0.1:4700;
    server_tokens off;
    location = /v1/search            { limit_except GET { deny all; } proxy_pass http://127.0.0.1:4600/rpc/v1_search$is_args$args; }
    location = /v1/search/structured { limit_except GET { deny all; } proxy_pass http://127.0.0.1:4600/rpc/v1_search_structured$is_args$args; }
    location = /v1/autocomplete      { limit_except GET { deny all; } proxy_pass http://127.0.0.1:4600/rpc/v1_autocomplete$is_args$args; }
    location = /v1/reverse           { limit_except GET { deny all; } proxy_pass http://127.0.0.1:4600/rpc/v1_reverse$is_args$args; }
    location = /v1/place             { limit_except GET { deny all; } proxy_pass http://127.0.0.1:4600/rpc/v1_place$is_args$args; }
    location / { return 404; }
}
