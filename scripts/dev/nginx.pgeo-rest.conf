# Edge for the Phase 13 pure-SQL API: Pelias paths -> PostgREST RPC paths, GET only.
# PostgREST (127.0.0.1:4600) keeps only the last segment of dotted query keys, and the SQL
# API's argument names are those last segments, so most query strings pass through
# unchanged. Two adjustments make it a drop-in for Pelias clients:
#   - boundary.circle.lat/lon/radius would collide with focus.point.lat/lon, so on search,
#     structured and autocomplete they are renamed to circle_lat/circle_lon/circle_radius.
#     (Reverse keeps boundary.circle.radius, which PostgREST passes as radius.)
#   - a parameter the SQL API does not declare makes PostgREST answer 404 ("function not
#     found"); the edge turns that into a Pelias-shaped 400.
# Local only: listens on 127.0.0.1:4700. Production would put these rules in the VM's nginx.

map $args $pgeo_args_1 {
    "~^(?<c1a>.*?)boundary\.circle\.lat=(?<c1b>.*)$" "${c1a}circle_lat=${c1b}";
    default $args;
}
map $pgeo_args_1 $pgeo_args_2 {
    "~^(?<c2a>.*?)boundary\.circle\.lon=(?<c2b>.*)$" "${c2a}circle_lon=${c2b}";
    default $pgeo_args_1;
}
map $pgeo_args_2 $pgeo_circle_args {
    "~^(?<c3a>.*?)boundary\.circle\.radius=(?<c3b>.*)$" "${c3a}circle_radius=${c3b}";
    default $pgeo_args_2;
}

server {
    listen 127.0.0.1:4700;
    server_tokens off;

    proxy_intercept_errors on;
    error_page 404 = @unsupported;

    location = /v1/search            { limit_except GET { deny all; } proxy_pass http://127.0.0.1:4600/rpc/v1_search?$pgeo_circle_args; }
    location = /v1/search/structured { limit_except GET { deny all; } proxy_pass http://127.0.0.1:4600/rpc/v1_search_structured?$pgeo_circle_args; }
    location = /v1/autocomplete      { limit_except GET { deny all; } proxy_pass http://127.0.0.1:4600/rpc/v1_autocomplete?$pgeo_circle_args; }
    location = /v1/reverse           { limit_except GET { deny all; } proxy_pass http://127.0.0.1:4600/rpc/v1_reverse$is_args$args; }
    location = /v1/place             { limit_except GET { deny all; } proxy_pass http://127.0.0.1:4600/rpc/v1_place$is_args$args; }
    # pgeo extension (not in Pelias): structured USPS-style address
    location = /v1/address           { limit_except GET { deny all; } proxy_pass http://127.0.0.1:4600/rpc/v1_address$is_args$args; }

    location @unsupported {
        default_type application/json;
        return 400 '{"geocoding":{"version":"0.2","errors":["unsupported parameter or endpoint: pgeo accepts the documented Pelias parameters"]},"type":"FeatureCollection","features":[]}';
    }
    location / { return 404; }
}
