# Local preview of the demo page with the same headers/CSP as production (infra/ansible
# roles/edge/templates/pelias.conf.j2). Used by scripts/dev_web.sh; listens on 127.0.0.1:8088
# and proxies /v1/ to the local Pelias API on 127.0.0.1:4000.
# API keys, as production (Phase 11). The launcher writes the dev key's hash into
# /etc/nginx/conf.d/apikey.map from $PGEO_API_KEY, or makes a key and prints it.
# A SHA-256 hex digest is 64 characters; nginx's default map bucket (32 or 64 bytes, by
# platform) cannot hold it, and the server refuses to start with "could not build map_hash".
map_hash_bucket_size 128;
js_import apikey from /etc/nginx/njs/apikey.js;
js_set $api_key_hash apikey.keyHash;
map $api_key_hash $api_client {
    default "";
    include /etc/nginx/conf.d/apikey.map;
}
log_format pathonly '$remote_addr - $api_client [$time_local] "$request_method $uri" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 127.0.0.1:8088;
    access_log /dev/stdout pathonly;
    server_tokens off;
    root /srv/pelias-demo;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    error_page 401 = @unauthorized;
    location @unauthorized {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header WWW-Authenticate 'X-API-Key realm="pgeo"' always;
        return 401 '{"geocoding":{"version":"0.2","errors":["an API key is required: send it in the X-API-Key header"]},"type":"FeatureCollection","features":[]}';
    }

    location ~ ^/v1/(autocomplete|search|search/structured|reverse|place)$ {
        limit_except GET { deny all; }
        if ($api_client = "") { return 401; }
        proxy_pass http://127.0.0.1:4000;
    }
    location /v1/ { return 404; }

    # Engine switch for side-by-side comparison (development only; production has none of
    # this, so the page hides the switch). pgeo pure SQL: PostgREST edge on 127.0.0.1:4700;
    # pgeo FastAPI on 127.0.0.1:4500.
    location = /engines.json {
        default_type application/json;
        return 200 '{"engines":[{"label":"Pelias","base":"","kind":"pelias"},{"label":"pgeo (pure SQL)","base":"/pgeo-sql","kind":"pgeo"},{"label":"pgeo (FastAPI)","base":"/pgeo-api","kind":"pgeo"}]}';
    }
    location ~ ^/pgeo-sql(/v1/(autocomplete|search|search/structured|reverse|place|address|attribution))$ {
        limit_except GET { deny all; }
        if ($api_client = "") { return 401; }
        proxy_pass http://127.0.0.1:4700$1$is_args$args;
    }
    location ~ ^/pgeo-api(/v1/(autocomplete|search|search/structured|reverse|place|address|attribution))$ {
        limit_except GET { deny all; }
        if ($api_client = "") { return 401; }
        proxy_pass http://127.0.0.1:4500$1$is_args$args;
    }
    location ~* \.mjs$ { default_type text/javascript; try_files $uri =404; }
    location /tiles/ { alias /srv/tiles/; }
    location / {
        # Development only: announce the engine switch to the page (production serves the
        # page unmodified, so it never requests /engines.json).
        sub_filter '</head>' '<meta name="demo-engines" content="/engines.json"></head>';
        sub_filter_once on;
        try_files $uri $uri/ =404;
    }
}
