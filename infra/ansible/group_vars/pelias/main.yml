# Defaults for a fresh deployment. The addresses and names here are documentation
# placeholders (RFC 5737 192.0.2.0/24, RFC 2606 example.org): put the real ones in
# group_vars/pelias/local.yml, which is gitignored and loaded after this file.
# See local.yml.example.
# --- access -------------------------------------------------------------------
admin_user: jcz
# Sources allowed to reach SSH: home LAN and the tailnet (CGNAT range).
ssh_allowed_sources: ["192.0.2.0/24", "100.64.0.0/10"]

# --- pelias runtime -----------------------------------------------------------
pelias_user: pelias
pelias_home: /opt/pelias_maine
pelias_data_dir: /srv/pelias/data
pelias_es_heap: 2g
# Query-time services only; importers never run on the VM.
pelias_query_services: [elasticsearch, libpostal, placeholder, pip, interpolation, api]
# Data dirs shipped from the workstation build (relative to its DATA_DIR).
pelias_sync_dirs: [whosonfirst, placeholder, interpolation, es_snapshots]
# Workstation paths (controller side).
local_repo_root: "{{ playbook_dir }}/../.."
local_project_dir: "{{ local_repo_root }}/projects/pelias_maine"
local_data_dir: "{{ local_repo_root }}/data/pelias"
# Snapshot to restore (created by scripts/snapshot_local.sh). Required on first deploy.
pelias_snapshot_name: ""
pelias_force_restore: false

# --- edge (nginx on the VM, behind wharf Caddy for TLS) ------------------------
edge_listen_port: 8080
# Only the TLS terminator may reach the edge port (wharf VM on the LAN).
edge_allowed_sources: ["192.0.2.254"]
edge_trusted_proxies: ["192.0.2.254"]
edge_server_name: geocoder.example.org
edge_demo_root: /srv/pelias-demo
# Controller-side sources for the demo page and its basemap.
local_web_dir: "{{ local_repo_root }}/web"
local_basemap_file: "{{ local_repo_root }}/data/raw/basemap/maine.pmtiles"
# Requests per second per client IP (real IP from X-Forwarded-For set by wharf Caddy).
edge_rate_search: 10
edge_rate_autocomplete: 25

# --- pgeo runtime (PostgreSQL/PostGIS geocoder; pure SQL via PostgREST) --------
# Decision 2026-09-19: deploy next to Pelias; VM 120 resized for it (docs/DEPLOY_PGEO.md).
# Set false to deploy pgeo alone: the Pelias upstream and routes disappear, pgeo answers on the
# canonical /v1/* paths so existing clients need no change, and the demo page announces one
# engine (no switch, no Compare tab). This is the small-VPS deployment the study recommends.
pelias_enabled: true
pgeo_enabled: true
pgeo_user: pgeo
pgeo_home: /opt/pgeo
pgeo_data_dir: /srv/pgeo
# Same digests as the workstation build (pgeo/docker/db/Dockerfile, pgeo/compose.yml); the
# official image is enough: the rule parser needs only core + contrib extensions.
pgeo_db_image: "postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677"
pgeo_rest_image: "postgrest/postgrest:v16.3@sha256:ec0e25a4e24b0a3bc5e4f011369bfc736bd1b19f513bd01079b86329a7636962"
# Server profile "large" (pgeo/tuning/profiles/large.toml): 4 vCPU, shared with Pelias.
pgeo_profile_name: large
pgeo_pg: { shared_buffers: 512MB, effective_cache_size: 1536MB, work_mem: 16MB }
pgeo_rest_pool: 10
pgeo_mem_limit_db: 2560m
pgeo_mem_limit_rest: 256m
# Dump to restore (created by scripts/pgeo_dump.sh). Required on first deploy.
pgeo_dump_name: ""
pgeo_force_restore: false
local_pgeo_dump_dir: "{{ local_repo_root }}/data/pgeo/dumps"
