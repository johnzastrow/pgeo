- name: Pelias Maine query host
  hosts: pelias
  become: true
  roles:
    - role: base
      tags: [base]
    - role: docker
      tags: [docker]
    - role: pelias_runtime
      tags: [pelias]
    - role: pgeo_runtime
      tags: [pgeo]
      when: pgeo_enabled | bool
    - role: edge
      tags: [edge]
