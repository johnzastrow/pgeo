# nginx on the VM: path allowlist, rate limits, real client IP, demo static files.
# TLS is terminated upstream (wharf Caddy on the LAN, or added here for exposure: public).

- name: Install nginx and the njs module (hashes API keys at the edge)
  ansible.builtin.apt:
    name: [nginx, libnginx-mod-http-js]
    state: present

- name: Refuse to deploy an edge that would accept no one
  # Fail closed, loudly: with the key check on and no keys, every API request is a 401. That is
  # the correct behaviour and almost never what an operator meant.
  ansible.builtin.assert:
    that: not (edge_require_api_key | default(true) | bool) or (edge_api_keys | default([]) | length > 0)
    fail_msg: >-
      edge_require_api_key is true but edge_api_keys is empty. Make a key with
      scripts/edge_apikey.sh new <client> and add its entry to group_vars/pelias/zz-local.yml,
      or set edge_require_api_key: false for a LAN demo with no authorization.

- name: njs script directory
  ansible.builtin.file:
    path: /etc/nginx/njs
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: API-key hash function (njs)
  ansible.builtin.copy:
    src: apikey.js
    dest: /etc/nginx/njs/apikey.js
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Demo site root
  ansible.builtin.file:
    path: "{{ edge_demo_root }}"
    state: directory
    owner: root
    group: www-data
    mode: "0755"

- name: Demo page files (web/ from the repo)
  ansible.posix.synchronize:
    src: "{{ local_web_dir }}/"
    dest: "{{ edge_demo_root }}/"
    delete: true
    rsync_opts: ["--exclude=tiles/", "--chown=root:www-data", "--chmod=D0755,F0644"]

- name: Basemap tiles directory
  ansible.builtin.file:
    path: "{{ edge_demo_root }}/tiles"
    state: directory
    owner: root
    group: www-data
    mode: "0755"

- name: Basemap PMTiles extract
  ansible.posix.synchronize:
    src: "{{ local_basemap_file }}"
    dest: "{{ edge_demo_root }}/tiles/{{ pgeo_build }}.pmtiles"
    rsync_opts: ["--chown=root:www-data", "--chmod=F0644"]

# Basemaps from an earlier build, or from before the files were named after the build. Each is
# about 300 MB and nothing references it once region.json names the current one.
- name: Find basemaps this host no longer serves
  ansible.builtin.find:
    paths: "{{ edge_demo_root }}/tiles"
    patterns: "*.pmtiles"
    excludes: "{{ pgeo_build }}.pmtiles"
  register: stale_tiles

- name: Remove them
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ stale_tiles.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

# What the demo page needs to know about this deployment's region: the map extent, which
# basemap to ask for, and what to call itself. Read by web/js/map.js; the same file is
# generated locally by scripts/gen_region_json.py for previews.
- name: Count the features this host serves
  ansible.builtin.command:
    cmd: >-
      docker exec pgeo_db psql -U pgeo -d pgeo -Atc
      "SELECT count(*) FROM pgeo.feature"
  register: pgeo_feature_count
  changed_when: false
  failed_when: false
  when: pgeo_enabled | bool

- name: Region description for the demo page
  ansible.builtin.copy:
    # Built in one expression so the numbers stay numbers: a YAML list of "{{ ... }}" strings
    # would put quoted coordinates in the JSON and MapLibre wants floats.
    content: |
      {{ {
           'build': pgeo_build,
           'name': build_states | map('extract', registry.states) | map(attribute='name') | join(', '),
           'states': build_states,
           'bounds': [[boxes | map(attribute=0) | min, boxes | map(attribute=1) | min],
                      [boxes | map(attribute=2) | max, boxes | map(attribute=3) | max]],
           'tiles': '/tiles/' + pgeo_build + '.pmtiles',
           'features': (pgeo_feature_count.stdout | default('0') | trim | int),
         } | to_nice_json }}
    dest: "{{ edge_demo_root }}/region.json"
    owner: root
    group: www-data
    mode: "0644"
  vars:
    registry: "{{ lookup('file', local_repo_root + '/regions/regions.json') | from_json }}"
    build_states: >-
      {{ registry.builds[pgeo_build].states
         if pgeo_build in registry.builds
         else (pgeo_build | upper | split(',')) }}
    boxes: "{{ build_states | map('extract', registry.states) | map(attribute='bbox') | list }}"

- name: Remove default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Pelias site config
  ansible.builtin.template:
    src: pelias.conf.j2
    dest: /etc/nginx/sites-available/pelias.conf
    mode: "0644"
  notify: Reload nginx

- name: Enable Pelias site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/pelias.conf
    dest: /etc/nginx/sites-enabled/pelias.conf
    state: link
  notify: Reload nginx

- name: Validate nginx config
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Allow the edge port from the TLS terminator only
  community.general.ufw:
    rule: allow
    port: "{{ edge_listen_port | string }}"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ edge_allowed_sources }}"

- name: Nginx running
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started
