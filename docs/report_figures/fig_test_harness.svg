   <g id="text_1">
    <text style="font-size: 6.5px; font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; fill: #111111" transform="translate(22.507053 46.08625)">k6 2.2.0 load generator</text>
    <text style="font-size: 6.5px; font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; fill: #111111" transform="translate(31.031702 55.82455)">(pinned to core 5)</text>
    <text style="font-size: 6.5px; font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; fill: #111111" transform="translate(57.8376 63.87285)"/>
    <text style="font-size: 6.5px; font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; fill: #111111" transform="translate(18.031702 75.30115)">per user: 60% type-ahead,</text>
    <text style="font-size: 6.5px; font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; fill: #111111" transform="translate(14.733459 85.399997)">15% search, 10% structured,</text>
    <text style="font-size: 6.5px; font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; fill: #111111" transform="translate(21.820491 95.138297)">15% reverse; 3-8 s think</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.5px; font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; fill: #111111" transform="translate(175.3337 41.2171)">engine under test</text>
    <text style="font-size: 6.5px; font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; fill: #111111" transform="translate(166.990848 50.9554)">(pinned to cores 0..N-1)</text>
    <text style="font-size: 6.5px; font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; fill: #111111" transform="translate(202.4712 59.0037)"/>
    <text style="font-size: 6.5px; font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; fill: #111111" transform="translate(163.672802 70.432)">memory limit per service,</text>
    <text style="font-size: 6.5px; font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; fill: #111111" transform="translate(189.718505 79.474597)">no swap</text>
    <text style="font-size: 6.5px; font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; fill: #111111" transform="translate(202.4712 88.2186)"/>
    <text style="font-size: 6.5px; font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; fill: #111111" transform="translate(157.511513 100.007447)">1, 2, 4 vCPU or unconstrained</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.5px; font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; fill: #111111" transform="translate(302.199342 35.7457)">sampler: docker stats every 2 s</text>
    <text style="font-size: 6.5px; font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; fill: #111111" transform="translate(311.056608 45.484)">CPU, memory, OOM kills,</text>
    <text style="font-size: 6.5px; font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; fill: #111111" transform="translate(337.378053 55.641753)">restarts</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.5px; font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; fill: #111111" transform="translate(304.078248 80.655753)">ramp 1, 2, 3, 4, 6 ... 512 users;</text>
    <text style="font-size: 6.5px; font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; fill: #111111" transform="translate(306.908795 90.51085)">15 s warm-up + 60 s steady;</text>
    <text style="font-size: 6.5px; font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; fill: #111111" transform="translate(319.435006 100.132353)">stop at &gt; 5% errors,</text>
    <text style="font-size: 6.5px; font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; fill: #111111" transform="translate(310.221256 109.98745)">p95 &gt; 5x target or a crash</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'Noto Sans', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #4d4d4d" x="126.1368" y="66.691" transform="rotate(-0 126.1368 66.691)">HTTP</text>
