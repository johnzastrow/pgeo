<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="img" aria-label="pgeo: a database cylinder with a location dot on its face">
  <title>pgeo — database cylinder with a located point</title>
  <!-- Unmistakably a database: three stacked ellipses. The red dot is the located place. -->
  <g fill="none" stroke="#1f5f8b" stroke-width="7" stroke-linecap="round">
    <ellipse cx="64" cy="30" rx="40" ry="14"/>
    <path d="M24 30v34c0 7.7 17.9 14 40 14s40-6.3 40-14V30"/>
    <path d="M24 47c0 7.7 17.9 14 40 14s40-6.3 40-14"/>
  </g>
  <circle cx="64" cy="92" r="12" fill="#c0392b"/>
  <path d="M64 104v14" stroke="#c0392b" stroke-width="7" stroke-linecap="round"/>
</svg>
