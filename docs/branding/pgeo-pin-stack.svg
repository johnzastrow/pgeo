<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="img" aria-label="pgeo: a map pin whose body is a stack of database layers">
  <title>pgeo — pin over database layers</title>
  <!-- A map pin whose interior is the three bands of a database cylinder: the place and the
       store are the same object, which is the whole idea. -->
  <defs>
    <clipPath id="pin">
      <path d="M64 12c-19.3 0-35 15.3-35 34.2 0 24.8 30.4 57.4 33.3 60.4a2.4 2.4 0 0 0 3.4 0
               C68.6 103.6 99 71 99 46.2 99 27.3 83.3 12 64 12z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#pin)">
    <rect x="24" y="8" width="80" height="104" fill="#c0392b"/>
    <g fill="#ffffff" opacity="0.92">
      <ellipse cx="64" cy="34" rx="30" ry="9"/>
      <rect x="34" y="46" width="60" height="7" rx="3.5"/>
      <rect x="34" y="60" width="60" height="7" rx="3.5"/>
    </g>
  </g>
  <path d="M64 12c-19.3 0-35 15.3-35 34.2 0 24.8 30.4 57.4 33.3 60.4a2.4 2.4 0 0 0 3.4 0
           C68.6 103.6 99 71 99 46.2 99 27.3 83.3 12 64 12z"
        fill="none" stroke="#1f5f8b" stroke-width="6"/>
</svg>
