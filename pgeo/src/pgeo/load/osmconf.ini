; GDAL OSM driver configuration for pgeo: only the tags the geocoder uses, as columns.
[general]
closed_ways_are_polygons=aeroway,amenity,boundary,building,craft,historic,landuse,leisure,military,natural,office,place,shop,sport,tourism,healthcare

[points]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,alt_name,official_name,addr:housenumber,addr:street,addr:postcode,addr:city,amenity,shop,tourism,leisure,office,craft,historic,healthcare,natural,aeroway,railway,public_transport,place,man_made,sport
other_tags=no
ignore=created_by,converted_by,source,time,ele,note,todo,fixme,FIXME

[lines]
