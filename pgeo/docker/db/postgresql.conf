# pgeo base configuration. Per-budget and per-experiment settings live in
# tuning/*.conf (mounted read-only) and are recorded in docs/PGEO_TUNING.md.
listen_addresses = '*'
port = 5432
max_connections = 40
password_encryption = scram-sha-256

# Conservative defaults for a small VM; overridden by the active tuning file.
shared_buffers = 512MB
effective_cache_size = 2GB
work_mem = 16MB
maintenance_work_mem = 512MB
random_page_cost = 1.1            # SSD
effective_io_concurrency = 200
jit = off                         # short OLTP-style queries; JIT compile cost dominates
max_parallel_workers_per_gather = 0

wal_level = minimal               # rebuildable data: no replication, cheap bulk loads
max_wal_senders = 0
synchronous_commit = off
checkpoint_timeout = 15min
max_wal_size = 4GB

log_min_duration_statement = 500
log_line_prefix = '%m [%p] %u@%d '

# Libraries: the libpostal extension arm sets shared_preload_libraries in its tuning file
# (model loaded once in the postmaster and shared copy-on-write by all backends).
include_if_exists = '/etc/postgresql/tuning/active.conf'
