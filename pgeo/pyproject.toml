[project]
name = "pgeo"
version = "0.20.1"
description = "PostgreSQL/PostGIS geocoder with a Pelias-compatible API (Phase 10)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "asyncpg==0.32.0",
    "httpx==0.28.1",
    "pydantic==2.14.2",
    "duckdb==2.0.0",
]

[project.scripts]
pgeo-load = "pgeo.load.cli:main"
pgeo-tune = "pgeo.tune:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgeo"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
